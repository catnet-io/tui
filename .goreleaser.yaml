version: 2

project_name: catnet-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: catnet-tui
    main: ./cmd/catnet-tui
    binary: catnet-tui
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: catnet-tui
    repository:
      owner: catnet-io
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/catnet-io/tui"
    description: "Terminal UI scanner frontend for CatNet"
    license: "MIT"
    directory: Formula
    install: |
      bin.install "catnet-tui"

scoops:
  - name: catnet-tui
    repository:
      owner: catnet-io
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/catnet-io/tui"
    description: "Terminal UI scanner frontend for CatNet"
    license: "MIT"
